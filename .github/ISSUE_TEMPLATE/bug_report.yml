name: Bug report
description: Report a defect in an @ark/* package
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@ark/core"
        - "@ark/sanitize"
        - "@ark/classify"
        - "@ark/policy"
        - "@ark/report"
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the actual vs. expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest input/code that reproduces the issue.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@ark/sanitize@0.2.0"
    validations:
      required: false
  - type: input
    id: runtime
    attributes:
      label: Node.js version
      placeholder: "v22.x"
    validations:
      required: false
